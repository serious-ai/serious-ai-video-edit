[project]
name = "serious-ai-video-edit"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code, local-first fork of browser-use/video-use (free on-device transcription by default, no ElevenLabs key required)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    "faster-whisper",
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
